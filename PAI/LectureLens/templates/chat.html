<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LectureLens – AI Study Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">◈</span>
                <span class="logo-text">LectureLens</span>
            </div>
            <p class="logo-sub">AI Study Assistant</p>
        </div>

        <div class="sidebar-section">
            <label class="section-label">Subject</label>
            <div class="select-wrapper">
                <select id="subjectSelect">
                    <option value="">All Subjects</option>
                </select>
                <span class="select-arrow">↓</span>
            </div>
        </div>

        <div class="sidebar-section">
            <button id="newChatBtn" class="new-chat-btn">
                <span>+</span> New Conversation
            </button>
        </div>

        <div class="sidebar-footer">
            <p>Ask questions about your<br>uploaded lecture materials.</p>
        </div>
    </div>

    <div class="main">
        <div id="chatHistory" class="chat-history">
            <div class="welcome-screen">
                <div class="welcome-icon">◈</div>
                <h2 class="welcome-title">What would you like to learn?</h2>
                <p class="welcome-sub">Select a subject from the sidebar or ask across all your materials.</p>
                <div class="suggestion-chips">
                    <button class="chip" onclick="fillQuestion(this)">Summarize key concepts</button>
                    <button class="chip" onclick="fillQuestion(this)">Explain this topic in simple terms</button>
                    <button class="chip" onclick="fillQuestion(this)">What are the main differences between...</button>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <div class="input-wrapper">
                <textarea
                    id="questionInput"
                    placeholder="Ask a question about your lecture materials…"
                    rows="1"
                ></textarea>
                <button id="sendBtn" title="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
